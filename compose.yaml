services:
  postgres:
    image: 'postgres:15-alpine'
    container_name: 'fixwi-db'
    environment:
      - 'POSTGRES_DB=fixwi'
      - 'POSTGRES_PASSWORD=admin123'
      - 'POSTGRES_USER=admin'
    ports:
      - '5332:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d fixwi" ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: